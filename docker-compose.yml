# Развертывание платформы мониторинга стоимости путешествий.
#
# Профили:
#   по умолчанию — postgres, redis, api, worker, beat, ui;
#   `--profile tools` — разовые контейнеры migrate/bootstrap.
#
# Секреты берутся только из .env (см. .env.example) и в репозиторий не попадают.
#
# ХРАНЕНИЕ ДАННЫХ. Накопленные наблюдения невосполнимы: источники не отдают
# историю цен, поэтому утраченный снимок рынка восстановить неоткуда.
# Поэтому база, сырые ответы и выгрузки лежат в bind-mount по абсолютному
# пути ${DATA_ROOT} вне каталога с исходниками. Это защищает от двух типовых
# способов потерять данные:
#   * имя named-тома выводится из имени каталога проекта, поэтому
#     развертывание из другого каталога «теряет» том, хотя он цел;
#   * пересоздание каталога с исходниками (git clone, распаковка архива)
#     не должно даже теоретически задевать данные.
# Redis намеренно оставлен named-томом: это брокер и кэш, его содержимое
# воспроизводимо.
#
# НИКОГДА не выполняйте `docker compose down -v` на рабочем стенде: ключ -v
# удаляет тома. Безопасное обновление — scripts/deploy.sh.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: travel-cost-observatory:1.0.0
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tco}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tco}
    REDIS_URL: redis://redis:6379/0
    RAW_STORAGE_DIR: /data/raw
    EXPORT_STORAGE_DIR: /data/exports
  volumes:
    - ${DATA_ROOT:-./var/data}/raw:/data/raw
    - ${DATA_ROOT:-./var/data}/exports:/data/exports
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-tco}
      # Ускоряет initdb и не влияет на корректность: контейнер одноразовый.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_ROOT:-./var/data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tco} -d ${POSTGRES_DB:-tco}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Порт наружу — только для отладки со стенда.
    ports: ["${POSTGRES_PORT:-127.0.0.1:5432}:5432"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    command: ["api"]
    ports: ["${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Сбор и расчет. Все длинное и сетевое живет здесь.
  #
  # Отделен от обслуживания намеренно: пока все очереди обслуживал один воркер,
  # забитый сбором пул не выполнял и детектор зависших задач — система теряла
  # способность чинить себя ровно тогда, когда это нужно. Шестого августа
  # воркер трижды за сутки вставал намертво, и лечением был перезапуск руками,
  # а прогон идет ночью.
  #
  # Проверка живости смотрит не на ответ процесса, а на движение очереди.
  # `celery inspect ping` отвечает из главного процесса и отвечает исправно,
  # когда все процессы пула заняты намертво: контейнер числился здоровым, в
  # логе стояла тишина, очередь не разбиралась. Теперь контейнер объявляется
  # больным, если задачи ждут, а за четверть часа ни одна не завершилась.
  worker:
    <<: *app
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tco}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tco}
      REDIS_URL: redis://redis:6379/0
      RAW_STORAGE_DIR: /data/raw
      EXPORT_STORAGE_DIR: /data/exports
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      CELERY_QUEUES: collect,compute
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "python", "-m", "tco.tasks.health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s

  # Обслуживание и пользовательские расчеты. Отдельный воркер нужен затем,
  # чтобы было кому чинить: сторож застрявшего сбора и детектор зависших задач
  # не должны стоять в той же очереди, которую они лечат. Параллелизм малый —
  # задачи короткие, а их назначение в том, чтобы оставаться доступными, когда
  # сбор занят.
  worker-service:
    <<: *app
    command: ["worker-service"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tco}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tco}
      REDIS_URL: redis://redis:6379/0
      RAW_STORAGE_DIR: /data/raw
      EXPORT_STORAGE_DIR: /data/exports
      CELERY_CONCURRENCY: ${CELERY_SERVICE_CONCURRENCY:-2}
      CELERY_QUEUES: maintenance,ondemand
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "python", "-m", "tco.tasks.health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s

  beat:
    <<: *app
    command: ["beat"]

  # Последняя линия обороны: зависший контейнер не падает, поэтому
  # `restart: unless-stopped` его не поднимет — перезапускать нездоровые
  # контейнеры некому, а прогон идет ночью. Autoheal делает это по метке,
  # не трогая остальные.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
      # Зависший воркер не отвечает на SIGTERM: остановка идет через kill.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Интерфейс: статика React-приложения + проксирование /api на backend,
  # поэтому фронтенд и API для браузера находятся на одном origin.
  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: travel-cost-observatory-ui:1.0.0
    ports: ["${UI_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped

  # --- Разовые операции (docker compose --profile tools run --rm ...) -------
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    profiles: [tools]

  bootstrap:
    <<: *app
    command: ["bootstrap"]
    restart: "no"
    profiles: [tools]

volumes:
  # Только брокер: его данные воспроизводимы. Все ценное — в ${DATA_ROOT}.
  redisdata:
