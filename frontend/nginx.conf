# Раздача SPA и проксирование API на backend.
#
# Фронтенд и API живут на одном origin, поэтому CORS не задействован,
# а токен не пересекает границу источников.

# Адрес api резолвится один раз при старте nginx — это цена keepalive к
# бэкенду. Поэтому пересоздание контейнера api (в сети Docker он получает новый
# адрес) требует перезапуска интерфейса, иначе /api/ отвечает 502, стучась по
# старому. Перезапуск делает scripts/deploy.sh, вручную — docker compose restart ui.
upstream tco_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загружаемые каталоги сценариев и выгрузки могут быть крупными.
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        # Заголовки безопасности повторяются в каждом location намеренно:
        # директива add_header внутри location полностью отменяет наследование
        # add_header из блока server.
        include /etc/nginx/conf.d/security-headers.inc;

        proxy_pass http://tco_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # On-demand расчет отвечает быстро (задача уходит в фон), но выгрузки
        # и разовые административные операции могут занимать десятки секунд.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Ассеты с хешем в имени неизменяемы — их можно кэшировать надолго.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Клиентская маршрутизация: неизвестный путь отдает index.html,
    # иначе перезагрузка страницы на /runs/<id> возвращала бы 404.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
