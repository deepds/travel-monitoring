[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# URL берется из окружения (DATABASE_URL) в migrations/env.py —
# строка подключения и пароль в репозитории не хранятся.
sqlalchemy.url =

# Форматирующий post-write hook намеренно не задан: ruff входит только в
# dev-зависимости, и его отсутствие в рантайм-образе роняло бы генерацию.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
