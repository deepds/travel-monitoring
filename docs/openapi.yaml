components:
  schemas:
    AccommodationType:
      type: string
      enum:
      - HOTEL
      - APARTMENT
      - GUEST_HOUSE
      - HOSTEL
      - SANATORIUM
      - OTHER
      title: AccommodationType
    AggregationRules:
      properties:
        per_source_statistic:
          type: string
          enum:
          - MEDIAN
          - P25
          - TRIMMED_MEAN
          - WINSORIZED_MEAN
          title: Per Source Statistic
          default: MEDIAN
        trim_ratio:
          type: number
          maximum: 0.45
          minimum: 0.0
          title: Trim Ratio
          default: 0.1
        cross_source_method:
          type: string
          enum:
          - MEDIAN_OF_MEDIANS
          - MEAN_OF_MEDIANS
          title: Cross Source Method
          default: MEDIAN_OF_MEDIANS
        two_source_method:
          type: string
          enum:
          - MEAN
          - MEDIAN
          title: Two Source Method
          default: MEAN
        percentile_method:
          type: string
          enum:
          - LINEAR
          - NEAREST_RANK
          title: Percentile Method
          default: LINEAR
        high_disagreement_threshold:
          type: number
          maximum: 5.0
          minimum: 0.0
          title: High Disagreement Threshold
          default: 0.3
        allow_single_source:
          type: boolean
          title: Allow Single Source
          default: true
      additionalProperties: false
      type: object
      title: AggregationRules
      description: Правила агрегации внутри и между источниками (SCOPE-R P §9).
    AuditAction:
      type: string
      enum:
      - LOGIN
      - SCENARIO_CREATE
      - SCENARIO_UPDATE
      - SCENARIO_ACTIVATE
      - SCENARIO_DEACTIVATE
      - SCENARIO_DELETE
      - SCENARIO_IMPORT
      - PROFILE_CREATE
      - PROFILE_ACTIVATE
      - PROFILE_ARCHIVE
      - PROFILE_CLONE
      - SOURCE_UPDATE
      - SOURCE_ENABLE
      - SOURCE_DISABLE
      - SOURCE_HEALTH_CHECK
      - SOURCE_CONFIDENCE_OVERRIDE
      - MONITORING_RUN
      - SNAPSHOT_RECALCULATE
      - JOB_RETRY
      - JOB_CANCEL
      - EXPORT
      - CACHE_PURGE
      - RETENTION_CLEANUP
      title: AuditAction
    Body_import_catalog_api_v1_admin_scenarios_import_post:
      properties:
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: File
          description: Файл CSV или YAML
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
          description: Содержимое каталога
      type: object
      title: Body_import_catalog_api_v1_admin_scenarios_import_post
    CalculationRequest:
      properties:
        scenario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Id
          description: Идентификатор существующего сценария
        scenario:
          anyOf:
          - $ref: '#/components/schemas/ScenarioCreate'
          - type: 'null'
          description: Параметры нового сценария
        profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Id
          description: Профиль расчета; по умолчанию активный
        force_refresh:
          type: boolean
          title: Force Refresh
          description: Игнорировать кэш и собрать данные заново
          default: false
      type: object
      title: CalculationRequest
      description: 'Запрос расчета: либо готовый сценарий, либо его параметры.'
    CancellationFilter:
      type: string
      enum:
      - ANY
      - FREE_CANCELLATION
      title: CancellationFilter
    ConfidenceLevel:
      type: string
      enum:
      - HIGH
      - MEDIUM
      - LOW
      - INSUFFICIENT
      title: ConfidenceLevel
    ConfidenceOverride:
      properties:
        score:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Score
        reason:
          type: string
          maxLength: 1024
          minLength: 3
          title: Reason
      type: object
      required:
      - score
      - reason
      title: ConfidenceOverride
      description: Ручной override Source Confidence — обязательно аудируется (DELTA §7.5).
    ConfidenceRules:
      properties:
        high_min_quality:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: High Min Quality
          default: 80.0
        medium_min_quality:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Medium Min Quality
          default: 60.0
        low_min_quality:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Low Min Quality
          default: 40.0
        high_min_sources_per_component:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: High Min Sources Per Component
          default: 2
        high_max_disagreement:
          type: number
          maximum: 5.0
          minimum: 0.0
          title: High Max Disagreement
          default: 0.15
        high_min_source_confidence:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: High Min Source Confidence
          default: 60.0
        max_unclassified_ratio:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Max Unclassified Ratio
          default: 0.4
      additionalProperties: false
      type: object
      title: ConfidenceRules
      description: Пороги Scenario Confidence (DELTA §8.3).
    ExportDataset:
      type: string
      enum:
      - SCENARIO_RUNS
      - OFFERS
      - SOURCE_METRICS
      title: ExportDataset
    ExportFormat:
      type: string
      enum:
      - CSV
      - XLSX
      title: ExportFormat
    ExportOptions:
      properties:
        dataset:
          $ref: '#/components/schemas/ExportDataset'
          default: SCENARIO_RUNS
        format:
          $ref: '#/components/schemas/ExportFormat'
          default: CSV
        limit:
          type: integer
          maximum: 1000000.0
          minimum: 1.0
          title: Limit
          default: 100000
        snapshot_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Snapshot Id
          description: Для набора OFFERS
        window_days:
          type: integer
          maximum: 365.0
          minimum: 1.0
          title: Window Days
          description: Для набора SOURCE_METRICS
          default: 30
      type: object
      title: ExportOptions
    FilterRules:
      properties:
        require_base_currency:
          type: boolean
          title: Require Base Currency
          default: true
        min_price:
          type: number
          minimum: 0.0
          title: Min Price
          default: 1.0
        max_price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Max Price
        require_capacity_confirmation:
          type: boolean
          title: Require Capacity Confirmation
          default: true
        strict_baggage_classification:
          type: boolean
          title: Strict Baggage Classification
          default: true
        stars_exact_match:
          type: boolean
          title: Stars Exact Match
          default: true
        meal_at_least_requested:
          type: boolean
          title: Meal At Least Requested
          default: true
        max_stops:
          anyOf:
          - type: integer
            maximum: 5.0
            minimum: 0.0
          - type: 'null'
          title: Max Stops
        enforce_cancellation_filter:
          type: boolean
          title: Enforce Cancellation Filter
          default: true
        allow_synthetic_sources:
          type: boolean
          title: Allow Synthetic Sources
          default: false
      additionalProperties: false
      type: object
      title: FilterRules
      description: Правила фильтрации предложений по профилю.
    FlightFareType:
      type: string
      enum:
      - CHEAPEST
      - CABIN_BAGGAGE
      - CHECKED_BAGGAGE
      title: FlightFareType
      description: Тарифные режимы авиа.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthComponent:
      properties:
        name:
          type: string
          title: Name
        healthy:
          type: boolean
          title: Healthy
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        metrics:
          additionalProperties: true
          type: object
          title: Metrics
      type: object
      required:
      - name
      - healthy
      title: HealthComponent
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        version:
          additionalProperties:
            type: string
          type: object
          title: Version
        deployment_mode:
          type: string
          title: Deployment Mode
        components:
          items:
            $ref: '#/components/schemas/HealthComponent'
          type: array
          title: Components
        warnings:
          items:
            type: string
          type: array
          title: Warnings
      type: object
      required:
      - status
      - version
      - deployment_mode
      title: HealthResponse
    InstantiateRequest:
      properties:
        origin_city_code:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Origin City Code
        destination_city_code:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Destination City Code
        departure_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Departure Date
        return_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Return Date
        adults:
          anyOf:
          - type: integer
            maximum: 9.0
            minimum: 1.0
          - type: 'null'
          title: Adults
        children_ages:
          anyOf:
          - items:
              type: integer
            type: array
            maxItems: 8
          - type: 'null'
          title: Children Ages
        scenario_type:
          $ref: '#/components/schemas/ScenarioType'
          default: ON_DEMAND
        overrides:
          additionalProperties: true
          type: object
