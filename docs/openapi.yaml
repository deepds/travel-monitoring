openapi: 3.1.0
info:
  title: Travel Cost Observatory
  description: '

    Платформа мониторинга стоимости путешествий (Travel Cost Observatory).


    Система рассчитывает **расчетную типовую стоимость путешествия** — воспроизводимую

    оценку стоимости заданного сценария на основе доступных рыночных предложений,

    выбранного профиля расчета и активной версии методики.


    Показатель является расчетной оценкой на основе доступных рыночных предложений. Это не оферта, не
    средний чек и не фактическая стоимость поездки. Расходы на развлечения, питание вне объекта размещения,
    трансферы и локальные траты не учитываются.


    Логическая цепочка данных:

    `TravelScenario → MarketSnapshot → Calculation Engine → ScenarioRun`.


    Длительные операции возвращают `202 Accepted` и `job_id`; состояние доступно

    через `GET /api/v1/jobs/{job_id}`.

    '
  contact:
    name: Travel Cost Observatory
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Полная проверка состояния
      description: 'Состояние всех подсистем.


        Возвращает ``503``, если недоступна база данных: без нее платформа

        неработоспособна. Недоступность кэша или raw-хранилища деградирует

        систему, но не останавливает расчеты.'
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
